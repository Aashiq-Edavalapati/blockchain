<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#131313" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <g transform="translate(20, 20) scale(0.6)" fill="none" stroke-width="8" stroke-linecap="round">
    <!-- Outer circle segments -->
    <path d="M 50,6 A 44,44 0 0,1 94,50" stroke="#FF5D00" />
    <path d="M 94,50 A 44,44 0 0,1 50,94" stroke="#FF8A00" />
    <path d="M 50,94 A 44,44 0 0,1 6,50" stroke="#E65100" />
    <path d="M 6,50 A 44,44 0 0,1 50,6" stroke="#FF3D00" />
    
    <!-- Substrate 'S' / block stack connections inside -->
    <path d="M 30,35 L 70,35 L 30,65 L 70,65" stroke="#FF6D00" stroke-width="10" stroke-linejoin="round" />
    <circle cx="30" cy="35" r="6" fill="#FFFFFF" />
    <circle cx="70" cy="35" r="6" fill="#FFFFFF" />
    <circle cx="30" cy="65" r="6" fill="#FFFFFF" />
    <circle cx="70" cy="65" r="6" fill="#FFFFFF" />
  </g>
</svg>
