<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#131313" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <g transform="translate(18, 18) scale(0.64)" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <!-- Outer hexagon/mesh structure -->
    <polygon points="50,5 93,30 93,80 50,105 7,80 7,30" fill="none" stroke="#2F80ED" />
    <!-- Inner network nodes and connections -->
    <circle cx="50" cy="5" r="5" fill="#2F80ED" />
    <circle cx="93" cy="30" r="5" fill="#56CCF2" />
    <circle cx="93" cy="80" r="5" fill="#2D9CDB" />
    <circle cx="50" cy="105" r="5" fill="#2F80ED" />
    <circle cx="7" cy="80" r="5" fill="#56CCF2" />
    <circle cx="7" cy="30" r="5" fill="#2D9CDB" />
    
    <line x1="50" y1="5" x2="93" y2="30" stroke="#2F80ED" />
    <line x1="93" y1="30" x2="93" y2="80" stroke="#56CCF2" />
    <line x1="93" y1="80" x2="50" y2="105" stroke="#2D9CDB" />
    <line x1="50" y1="105" x2="7" y2="80" stroke="#2F80ED" />
    <line x1="7" y1="80" x2="7" y2="30" stroke="#56CCF2" />
    <line x1="7" y1="30" x2="50" y2="5" stroke="#2D9CDB" />
    
    <!-- Central hub -->
    <circle cx="50" cy="55" r="16" fill="none" stroke="#56CCF2" stroke-width="5" />
    <line x1="50" y1="5" x2="50" y2="39" stroke="#2F80ED" />
    <line x1="93" y1="80" x2="66" y2="65" stroke="#2D9CDB" />
    <line x1="7" y1="80" x2="34" y2="65" stroke="#56CCF2" />
  </g>
</svg>
